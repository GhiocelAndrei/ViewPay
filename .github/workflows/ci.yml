name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build backend/Vira.slnx -c Release

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ai-service/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # npm workspace: install from the root, never from apps/*. Installing
      # inside an app nests react-native or tailwindcss and silently breaks
      # NativeWind's type augmentation (see CLAUDE.md).
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run build:web
